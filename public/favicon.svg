    <path d="M 352 176 L 432 256 L 352 336" stroke="url(#faviconGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="290" y1="144" x2="222" y2="368" stroke="#38bdf8" stroke-width="32" stroke-linecap="round" />
