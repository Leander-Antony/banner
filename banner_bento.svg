<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Leander Antony Bento Grid Profile Banner">
<defs>
  <linearGradient id="bentoBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b1329"/>
    <stop offset="50%" stop-color="#111c3d"/>
    <stop offset="100%" stop-color="#070c1a"/>
  </linearGradient>

  <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
  </radialGradient>

  <filter id="glowSoft"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blurBg"><feGaussianBlur stdDeviation="50"/></filter>

  <clipPath id="mainClip"><rect width="1180" height="610" rx="20"/></clipPath>
  <clipPath id="avatarCircle"><circle cx="75" cy="75" r="70"/></clipPath>
</defs>

<g clip-path="url(#mainClip)">
  <!-- Background Canvas -->
  <rect width="1180" height="610" fill="url(#bentoBg)"/>
  <circle cx="200" cy="150" r="280" fill="url(#orbA)" filter="url(#blurBg)"/>
  <circle cx="950" cy="450" r="300" fill="url(#orbB)" filter="url(#blurBg)"/>
  <rect x="2" y="2" width="1176" height="606" rx="18" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1.5"/>

  <!-- TILE 1: MAIN HERO CARD (Top Left, 740x260) -->
  <g transform="translate(24, 24)">
    <rect width="740" height="260" rx="18" fill="#182752" opacity="0.85" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    <g transform="translate(32, 32)">
      <g>
        <circle cx="75" cy="75" r="78" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.9" filter="url(#glowSoft)"/>
        <circle cx="75" cy="75" r="72" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.4"/>
        <g clip-path="url(#avatarCircle)">
          <rect width="150" height="150" fill="#111c3d"/>
          <image href="https://github.com/Leander-Antony.png" width="150" height="150" preserveAspectRatio="xMidYMid slice"/>
        </g>
      </g>
      <g transform="translate(180, 20)">
        <g>
          <rect width="210" height="26" rx="13" fill="rgba(56,189,248,0.12)" stroke="#38bdf8" stroke-width="1"/>
          <circle cx="16" cy="13" r="4" fill="#38bdf8" filter="url(#glowSoft)">
            <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
          </circle>
          <text x="28" y="17" font-family="'Consolas', 'Fira Code', monospace" font-size="11.5" font-weight="600" fill="#38bdf8">AVAILABLE FOR OPPORTUNITIES</text>
        </g>
        <text x="0" y="65" font-family="'Outfit', sans-serif" font-size="34" font-weight="800" fill="#ffffff">Leander Antony</text>
        <text x="0" y="94" font-family="'Fira Code', monospace" font-size="15" font-weight="600" fill="#38bdf8">✦ AI &amp; Data Science Student</text>
        <text x="0" y="124" font-family="'Inter', sans-serif" font-size="13" fill="#9ca3af">// AI/ML student &amp; full-stack dev</text>
      </g>
    </g>
  </g>

  <!-- TILE 2: FOCUS CARD (Top Right, 368x260) -->
  <g transform="translate(788, 24)">
    <rect width="368" height="260" rx="18" fill="#182752" opacity="0.85" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <text x="0" y="16" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="0.1em">CURRENT FOCUS &amp; PROJECTS</text>
      <text x="0" y="48" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#ffffff">LLM Text Game &amp; Advanced ML Tools</text>
      <text x="0" y="74" font-family="'Inter', sans-serif" font-size="12" fill="#9ca3af">Education: B.Tech, Artificial Intelligence &amp; Data Science</text>
      <g transform="translate(0, 105)">
        <rect width="320" height="8" rx="4" fill="#0d1117"/>
        <rect width="240" height="8" rx="4" fill="#38bdf8"/>
        <text x="0" y="28" font-family="'Fira Code', monospace" font-size="11" fill="#9ca3af">Active Progress: <tspan fill="#38bdf8" font-weight="700">In Development</tspan></text>
      </g>
    </g>
  </g>

  <!-- TILE 3: TECH MATRIX -->
  <g transform="translate(24, 308)">
    <rect width="480" height="278" rx="18" fill="#182752" opacity="0.85" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <text x="0" y="16" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.1em">TECH MATRIX &amp; SKILLS</text>
      <g>
        <g transform="translate(0, 36)">
          <rect width="77" height="26" rx="10" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
          <text x="38.5" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#ffffff">Python</text>
        </g>
        <g transform="translate(85, 36)">
          <rect width="84.5" height="26" rx="10" fill="rgba(129, 140, 248, 0.12)" stroke="#818cf8" stroke-width="1"/>
          <text x="42.25" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#ffffff">PyTorch</text>
        </g>
        <g transform="translate(177.5, 36)">
          <rect width="107" height="26" rx="10" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
          <text x="53.5" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#ffffff">TensorFlow</text>
        </g>
        <g transform="translate(292.5, 36)">
          <rect width="107" height="26" rx="10" fill="rgba(129, 140, 248, 0.12)" stroke="#818cf8" stroke-width="1"/>
          <text x="53.5" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#ffffff">JavaScript</text>
        </g>
        <g transform="translate(0, 70)">
          <rect width="69.5" height="26" rx="10" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
          <text x="34.75" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#ffffff">React</text>
        </g>
        <g transform="translate(77.5, 70)">
          <rect width="77" height="26" rx="10" fill="rgba(129, 140, 248, 0.12)" stroke="#818cf8" stroke-width="1"/>
          <text x="38.5" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#ffffff">Svelte</text>
        </g>
        <g transform="translate(162.5, 70)">
          <rect width="69.5" height="26" rx="10" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
          <text x="34.75" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#ffffff">MySQL</text>
        </g>
        <g transform="translate(240, 70)">
          <rect width="77" height="26" rx="10" fill="rgba(129, 140, 248, 0.12)" stroke="#818cf8" stroke-width="1"/>
          <text x="38.5" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#ffffff">Docker</text>
        </g>
        <g transform="translate(325, 70)">
          <rect width="54.5" height="26" rx="10" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
          <text x="27.25" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#ffffff">Git</text>
        </g>
        <g transform="translate(0, 104)">
          <rect width="77" height="26" rx="10" fill="rgba(129, 140, 248, 0.12)" stroke="#818cf8" stroke-width="1"/>
          <text x="38.5" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#ffffff">Pandas</text>
        </g>
        <g transform="translate(85, 104)">
          <rect width="69.5" height="26" rx="10" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
          <text x="34.75" y="17" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" font-weight="600" fill="#ffffff">Flask</text>
        </g>
      </g>
      <text x="0" y="200" font-family="'Inter', sans-serif" font-size="12" fill="#9ca3af">B.Tech AI &amp; Data Science • India</text>
    </g>
  </g>

  <!-- TILE 4: PHILOSOPHY TILE -->
  <g transform="translate(520, 308)">
    <rect width="350" height="278" rx="18" fill="#182752" opacity="0.85" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    <g transform="translate(24, 24)">
      <text x="0" y="16" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.1em">PERSONAL PHILOSOPHY</text>
      <line x1="0" y1="30" x2="302" y2="30" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
      <g font-family="'Georgia', serif" font-style="italic" font-size="14" fill="#f0f6fc">
        <text x="0" y="64">"When you decided to go to</text>
        <text x="0" y="86">the sea, it was your own decision."</text>
      </g>
      <text x="0" y="118" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">— Roronoa Zoro (One Piece)</text>
      <!-- Code Motto Box -->
      <g transform="translate(0, 150)">
        <rect width="302" height="60" rx="10" fill="#111c3d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="14" y="25" font-family="'Fira Code', monospace" font-size="11" fill="#9ca3af">Core Mindset:</text>
      </g>
    </g>
  </g>

  <!-- TILE 5: SOCIALS (Bottom Right, 268x278) -->
  <g transform="translate(886, 308)">
    <rect width="270" height="278" rx="18" fill="#182752" opacity="0.85" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    <g transform="translate(20, 24)">
      <text x="0" y="16" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#818cf8" letter-spacing="0.1em">CONNECT &amp; LINKS</text>
      <g transform="translate(0, 36)">
        <rect width="230" height="34" rx="10" fill="#111c3d"/>
        <text x="15" y="21" font-family="'Fira Code', monospace" font-size="11.5" fill="#ffffff">github.com/Leander-Antony</text>
        
        <rect y="46" width="230" height="34" rx="10" fill="#111c3d"/>
        <text x="15" y="67" font-family="'Fira Code', monospace" font-size="11.5" fill="#ffffff">leander.antony2023@...</text>

        <rect y="92" width="230" height="34" rx="10" fill="#111c3d"/>
        <text x="15" y="113" font-family="'Fira Code', monospace" font-size="11.5" fill="#38bdf8">LinkedIn Profile</text>
      </g>
    </g>
  </g>
</g>
</svg>
